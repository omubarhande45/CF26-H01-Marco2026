# Full stack: 3 nodes + gateway + web (nginx).
# Usage (from repo root):
#   cp deploy/.env.example .env
#   docker compose -f deploy/docker-compose.yml up -d --build
# Open http://localhost   (web)   http://localhost:8080  (gateway)

name: fcqf

services:
  hospital_a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    command: ["uvicorn", "institutional_nodes.node_app:app", "--host", "0.0.0.0", "--port", "8101"]
    environment:
      NODE_ID: hospital_a
      NODE_NAME: Hospital A
      DB_PATH: /app/institutional_nodes/data/hospital_a.db
      FCQF_ENV: ${FCQF_ENV:-production}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      REQUIRE_SERVICE_AUTH: ${REQUIRE_SERVICE_AUTH:-0}
    expose: ["8101"]
    restart: unless-stopped

  hospital_b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    command: ["uvicorn", "institutional_nodes.node_app:app", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      NODE_ID: hospital_b
      NODE_NAME: Hospital B
      DB_PATH: /app/institutional_nodes/data/hospital_b.db
      FCQF_ENV: ${FCQF_ENV:-production}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      REQUIRE_SERVICE_AUTH: ${REQUIRE_SERVICE_AUTH:-0}
    expose: ["8102"]
    restart: unless-stopped

  diagnostic_lab:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    command: ["uvicorn", "institutional_nodes.node_app:app", "--host", "0.0.0.0", "--port", "8103"]
    environment:
      NODE_ID: diagnostic_lab
      NODE_NAME: Diagnostic Laboratory
      DB_PATH: /app/institutional_nodes/data/diagnostic_lab.db
      FCQF_ENV: ${FCQF_ENV:-production}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      REQUIRE_SERVICE_AUTH: ${REQUIRE_SERVICE_AUTH:-0}
    expose: ["8103"]
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      NODE_A: http://hospital_a:8101
      NODE_B: http://hospital_b:8102
      NODE_L: http://diagnostic_lab:8103
      FCQF_ENV: ${FCQF_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-fcqf-dev-secret-change-me}
      AUTH_PROVIDER: local
      ALLOW_DEMO_USERS: ${ALLOW_DEMO_USERS:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      REQUIRE_SERVICE_AUTH: ${REQUIRE_SERVICE_AUTH:-0}
      MIN_COHORT: ${MIN_COHORT:-10}
    ports:
      - "8080:8080"
    depends_on:
      - hospital_a
      - hospital_b
      - diagnostic_lab
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: unless-stopped
